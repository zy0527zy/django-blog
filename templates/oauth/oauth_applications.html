{% load i18n %}
{% load static %}
<div class="widget-login flex items-center gap-3 flex-wrap">
    {% if apps %}
        <small class="text-sm text-muted-foreground">
            {% trans 'quick login' %}:
        </small>
        <div class="flex gap-2 flex-wrap">
            {% for icon,url in apps %}
            <a href="{{ url }}"
               rel="nofollow"
               hx-boost="false"
               class="inline-flex items-center justify-center h-10 px-4 rounded-lg border border-border hover:border-primary text-sm font-medium transition-colors"
               title="使用 {{ icon }} 登录">
                {{ icon|title }} 登录
            </a>
        {% endfor %}
        </div>
    {% endif %}
</div>

<link rel="stylesheet" href="{% static 'blog/css/oauth_style.css' %}" media="print" onload="this.media='all'; this.onload=null;">
<noscript><link rel="stylesheet" href="{% static 'blog/css/oauth_style.css' %}"></noscript>
